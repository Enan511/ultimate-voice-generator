plugins { id 'com.android.application' }
android {
    namespace 'com.ultimatevoicegenerator'
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"
    defaultConfig { applicationId 'com.ultimatevoicegenerator'; minSdk 36; targetSdk 36; versionCode 321; versionName '3.2.1'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = false } }
    androidResources { noCompress += ['gguf', 'bin'] }
}
dependencies { implementation 'androidx.documentfile:documentfile:1.0.1' }
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
